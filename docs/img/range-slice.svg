<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 268" width="1160" height="268" role="img" aria-label="A range is tiled with mirror edges, hours, days and months" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202A"/></marker><marker id="a-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202A"/></marker><marker id="a-pen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2846C4"/></marker><marker id="a-pen-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2846C4"/></marker><marker id="a-umb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A85A0C"/></marker><marker id="a-umb-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A85A0C"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56616E"/></marker><marker id="a-slate-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56616E"/></marker><marker id="a-lim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8222B"/></marker><marker id="a-lim-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8222B"/></marker></defs><rect width="1160" height="268" rx="12" fill="#FFFFFF"/><text x="40" y="44" font-size="21" fill="#16202A" font-weight="700" text-anchor="start" >Any range, exact: 14 August 09:17:03 to 3 October 18:41:59</text><text x="40" y="72" font-size="15" fill="#56616E" font-weight="400" text-anchor="start" >Whole buckets come from rollups. Only the two thin edges read raw rows, from a narrow mirror with no personal data.</text><rect x="40" y="100" width="72" height="76" fill="#F6E7D6" stroke="#A85A0C" stroke-width="1"/><text x="76.0" y="144" font-size="14" fill="#16202A" font-weight="600" text-anchor="middle" >Edge</text><text x="76.0" y="204" font-size="12" fill="#56616E" font-weight="400" text-anchor="middle" >mirror rows</text><rect x="116" y="100" width="120" height="76" fill="#DDE3FA" stroke="#2846C4" stroke-width="1"/><text x="176.0" y="144" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Hours</text><text x="176.0" y="204" font-size="14" fill="#56616E" font-weight="400" text-anchor="middle" >14 Aug</text><rect x="240" y="100" width="190" height="76" fill="#B9C5F4" stroke="#2846C4" stroke-width="1"/><text x="335.0" y="144" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Days</text><text x="335.0" y="204" font-size="14" fill="#56616E" font-weight="400" text-anchor="middle" >15 to 31 Aug</text><rect x="434" y="100" width="350" height="76" fill="#2846C4" stroke="#2846C4" stroke-width="1"/><text x="609.0" y="144" font-size="17" fill="#FBFBF8" font-weight="600" text-anchor="middle" >Month</text><text x="609.0" y="204" font-size="14" fill="#56616E" font-weight="400" text-anchor="middle" >September</text><rect x="788" y="100" width="110" height="76" fill="#B9C5F4" stroke="#2846C4" stroke-width="1"/><text x="843.0" y="144" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Days</text><text x="843.0" y="204" font-size="14" fill="#56616E" font-weight="400" text-anchor="middle" >1 to 2 Oct</text><rect x="902" y="100" width="140" height="76" fill="#DDE3FA" stroke="#2846C4" stroke-width="1"/><text x="972.0" y="144" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Hours</text><text x="972.0" y="204" font-size="14" fill="#56616E" font-weight="400" text-anchor="middle" >3 Oct</text><rect x="1046" y="100" width="72" height="76" fill="#F6E7D6" stroke="#A85A0C" stroke-width="1"/><text x="1082.0" y="144" font-size="14" fill="#16202A" font-weight="600" text-anchor="middle" >Edge</text><text x="1082.0" y="204" font-size="12" fill="#56616E" font-weight="400" text-anchor="middle" >mirror rows</text><text x="40" y="244" font-size="15" fill="#56616E" font-weight="400" text-anchor="start" >The planner picks the smallest rollup that covers the query, and tiles the range with no gap or overlap: a test checks that.</text></svg>