<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 428" width="1280" height="428" role="img" aria-label="Six isolation checks, and where each drill fault was stopped: 0 leaked" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202A"/></marker><marker id="a-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202A"/></marker><marker id="a-pen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2846C4"/></marker><marker id="a-pen-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2846C4"/></marker><marker id="a-umb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A85A0C"/></marker><marker id="a-umb-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A85A0C"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56616E"/></marker><marker id="a-slate-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56616E"/></marker><marker id="a-lim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8222B"/></marker><marker id="a-lim-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8222B"/></marker></defs><rect width="1280" height="428" rx="12" fill="#FFFFFF"/><text x="40" y="44" font-size="21" fill="#16202A" font-weight="700" text-anchor="start" >Six checks between a store and an answer</text><text x="40" y="72" font-size="15" fill="#56616E" font-weight="400" text-anchor="start" >Each assumes the others failed. Drills inject real faults into Cuboid’s own code and count what gets through.</text><rect x="40" y="100" width="180" height="104" rx="8" fill="#FFFFFF" stroke="#2846C4" stroke-width="1.5"/><text x="130" y="130" font-size="16" fill="#16202A" font-weight="700" text-anchor="middle" >Key scope</text><text x="130" y="156" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >Hashed keys,</text><text x="130" y="176" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >one scope each</text><line x1="220" y1="152" x2="238" y2="152" stroke="#2846C4" stroke-width="2" marker-end="url(#a-pen)"/><rect x="240" y="100" width="180" height="104" rx="8" fill="#FFFFFF" stroke="#2846C4" stroke-width="1.5"/><text x="330" y="130" font-size="16" fill="#16202A" font-weight="700" text-anchor="middle" >Path check</text><text x="330" y="156" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >Other ids: 404,</text><text x="330" y="176" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >same as missing</text><line x1="420" y1="152" x2="438" y2="152" stroke="#2846C4" stroke-width="2" marker-end="url(#a-pen)"/><rect x="440" y="100" width="180" height="104" rx="8" fill="#FFFFFF" stroke="#2846C4" stroke-width="1.5"/><text x="530" y="130" font-size="16" fill="#16202A" font-weight="700" text-anchor="middle" >Cache partition</text><text x="530" y="156" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >One LRU</text><text x="530" y="176" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >per store</text><line x1="620" y1="152" x2="638" y2="152" stroke="#2846C4" stroke-width="2" marker-end="url(#a-pen)"/><rect x="640" y="100" width="180" height="104" rx="8" fill="#FFFFFF" stroke="#2846C4" stroke-width="1.5"/><text x="730" y="130" font-size="16" fill="#16202A" font-weight="700" text-anchor="middle" >Row security</text><text x="730" y="156" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >Transaction-local</text><text x="730" y="176" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >tenant setting</text><line x1="820" y1="152" x2="838" y2="152" stroke="#2846C4" stroke-width="2" marker-end="url(#a-pen)"/><rect x="840" y="100" width="180" height="104" rx="8" fill="#FFFFFF" stroke="#2846C4" stroke-width="1.5"/><text x="930" y="130" font-size="16" fill="#16202A" font-weight="700" text-anchor="middle" >Result check</text><text x="930" y="156" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >Every row’s</text><text x="930" y="176" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >store asserted</text><line x1="1020" y1="152" x2="1038" y2="152" stroke="#2846C4" stroke-width="2" marker-end="url(#a-pen)"/><rect x="1040" y="100" width="180" height="104" rx="8" fill="#FFFFFF" stroke="#2846C4" stroke-width="1.5"/><text x="1130" y="130" font-size="16" fill="#16202A" font-weight="700" text-anchor="middle" >Response guard</text><text x="1130" y="156" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >Last look at</text><text x="1130" y="176" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >every reply</text><text x="40" y="248" font-size="14" fill="#16202A" font-weight="600" text-anchor="start" >Drill A: shared cache key</text><line x1="40" y1="256" x2="1120" y2="256" stroke="#C8222B" stroke-width="2.4"/><path d="M1122 248 L1138 264 M1138 248 L1122 264" stroke="#C8222B" stroke-width="3.4"/><text x="1110" y="248" font-size="14" fill="#C8222B" font-weight="700" text-anchor="end" >Stopped at the guard</text><text x="40" y="298" font-size="14" fill="#16202A" font-weight="600" text-anchor="start" >Drill B: connection mix-up, the INC-02 mechanism</text><line x1="40" y1="306" x2="920" y2="306" stroke="#C8222B" stroke-width="2.4"/><path d="M922 298 L938 314 M938 298 L922 314" stroke="#C8222B" stroke-width="3.4"/><text x="910" y="298" font-size="14" fill="#C8222B" font-weight="700" text-anchor="end" >Stopped at the result check</text><text x="40" y="348" font-size="14" fill="#16202A" font-weight="600" text-anchor="start" >Drill C: missing tenant setting</text><line x1="40" y1="356" x2="720" y2="356" stroke="#C8222B" stroke-width="2.4"/><path d="M722 348 L738 364 M738 348 L722 364" stroke="#C8222B" stroke-width="3.4"/><text x="710" y="348" font-size="14" fill="#C8222B" font-weight="700" text-anchor="end" >Stopped at row security</text><text x="40" y="402" font-size="17" fill="#1D7A47" font-weight="700" text-anchor="start" >0 leaked in every drill at 10M orders. 0 of 1,000,000 randomized requests crossed stores.</text></svg>