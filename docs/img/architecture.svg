<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" width="1280" height="570" role="img" aria-label="Architecture: the store app writes to the main database; a stream reader, engine and flush feed an aggregate store; dashboards read through key and path checks, planner, cache and limiter, and a response guard." font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202A"/></marker><marker id="a-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202A"/></marker><marker id="a-pen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2846C4"/></marker><marker id="a-pen-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2846C4"/></marker><marker id="a-umb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A85A0C"/></marker><marker id="a-umb-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A85A0C"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56616E"/></marker><marker id="a-slate-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56616E"/></marker><marker id="a-lim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8222B"/></marker><marker id="a-lim-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8222B"/></marker></defs><rect width="1280" height="570" rx="12" fill="#FFFFFF"/><rect x="40" y="70" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#16202A" stroke-width="1.5"/><text x="125.0" y="104.0" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Store app</text><text x="125.0" y="125.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >normal reads, writes</text><rect x="40" y="226" width="170" height="84" rx="8" fill="#FFFFFF" stroke="#A85A0C" stroke-width="1.5"/><text x="125.0" y="265.0" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Main database</text><text x="125.0" y="286.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >Postgres, WAL</text><line x1="125" y1="144" x2="125" y2="224" stroke="#16202A" stroke-width="2.2" marker-end="url(#a-ink)"/><rect x="300" y="40" width="620" height="190" rx="12" fill="#F2F4FC" stroke="#2846C4" stroke-width="1.5"/><text x="320" y="70" font-size="16" fill="#2846C4" font-weight="700" text-anchor="start" >Write path: from the change stream to rollups</text><rect x="320" y="92" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#16202A" stroke-width="1.5"/><text x="405.0" y="126.0" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Stream reader</text><text x="405.0" y="147.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >whole transactions</text><rect x="525" y="92" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#16202A" stroke-width="1.5"/><text x="610.0" y="126.0" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Engine</text><text x="610.0" y="147.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >retract old, add new</text><rect x="730" y="92" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#16202A" stroke-width="1.5"/><text x="815.0" y="126.0" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Flush</text><text x="815.0" y="147.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >one transaction, 1 s</text><line x1="492" y1="129" x2="523" y2="129" stroke="#16202A" stroke-width="2.2" marker-end="url(#a-ink)"/><line x1="697" y1="129" x2="728" y2="129" stroke="#16202A" stroke-width="2.2" marker-end="url(#a-ink)"/><text x="610" y="198" font-size="14" fill="#56616E" font-weight="400" text-anchor="middle" >Rollup deltas, mirror rows and the applied LSN commit together, so a crash resumes exactly.</text><path d="M212 262 C 260 262, 262 130, 318 130" fill="none" stroke="#16202A" stroke-width="2.6" marker-end="url(#a-ink)"/><text x="222" y="190" font-size="13" fill="#56616E" font-weight="400" text-anchor="start" >logical</text><text x="222" y="207" font-size="13" fill="#56616E" font-weight="400" text-anchor="start" >replication</text><rect x="1030" y="180" width="210" height="130" rx="8" fill="#FFFFFF" stroke="#2846C4" stroke-width="1.5"/><text x="1135.0" y="242.0" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Aggregate store</text><text x="1135.0" y="263.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >rollups, mirror, position</text><path d="M902 129 C 980 129, 1000 190, 1028 215" fill="none" stroke="#16202A" stroke-width="2.6" marker-end="url(#a-ink)"/><rect x="300" y="270" width="620" height="190" rx="12" fill="#F2F4FC" stroke="#2846C4" stroke-width="1.5"/><text x="320" y="300" font-size="16" fill="#2846C4" font-weight="700" text-anchor="start" >Read path: every request, every time</text><rect x="320" y="322" width="130" height="74" rx="8" fill="#FFFFFF" stroke="#16202A" stroke-width="1.5"/><text x="385.0" y="356.0" font-size="16" fill="#16202A" font-weight="600" text-anchor="middle" >Key, path</text><text x="385.0" y="377.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >who may ask</text><rect x="473" y="322" width="130" height="74" rx="8" fill="#FFFFFF" stroke="#16202A" stroke-width="1.5"/><text x="538.0" y="356.0" font-size="16" fill="#16202A" font-weight="600" text-anchor="middle" >Planner</text><text x="538.0" y="377.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >smallest rollup</text><rect x="626" y="322" width="130" height="74" rx="8" fill="#FFFFFF" stroke="#16202A" stroke-width="1.5"/><text x="691.0" y="356.0" font-size="16" fill="#16202A" font-weight="600" text-anchor="middle" >Cache, limit</text><text x="691.0" y="377.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >per store</text><rect x="779" y="322" width="125" height="74" rx="8" fill="#FFFFFF" stroke="#16202A" stroke-width="1.5"/><text x="841.5" y="356.0" font-size="16" fill="#16202A" font-weight="600" text-anchor="middle" >Guard</text><text x="841.5" y="377.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >checks the reply</text><line x1="452" y1="359" x2="471" y2="359" stroke="#16202A" stroke-width="2.2" marker-end="url(#a-ink)"/><line x1="605" y1="359" x2="624" y2="359" stroke="#16202A" stroke-width="2.2" marker-end="url(#a-ink)"/><line x1="758" y1="359" x2="777" y2="359" stroke="#16202A" stroke-width="2.2" marker-end="url(#a-ink)"/><text x="610" y="428" font-size="14" fill="#56616E" font-weight="400" text-anchor="middle" >Reads run under row-level security. Every result row’s store is asserted before use.</text><rect x="40" y="360" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#16202A" stroke-width="1.5"/><text x="125.0" y="394.0" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Dashboards</text><text x="125.0" y="415.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >API clients</text><line x1="212" y1="380" x2="318" y2="362" stroke="#2846C4" stroke-width="2.6" marker-end="url(#a-pen)"/><path d="M300 416 L 212 416" fill="none" stroke="#2846C4" stroke-width="2.6" marker-end="url(#a-pen)"/><text x="255" y="342" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >API key</text><path d="M756 322 C 860 255, 960 300, 1028 280" fill="none" stroke="#2846C4" stroke-width="2.6" marker-end="url(#a-pen)"/><text x="965" y="262" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >row security</text><rect x="1030" y="392" width="210" height="70" rx="8" fill="#FFFFFF" stroke="#56616E" stroke-width="1.5"/><text x="1135.0" y="424.0" font-size="17" fill="#16202A" font-weight="600" text-anchor="middle" >Check a number</text><text x="1135.0" y="445.0" font-size="13" fill="#56616E" font-weight="400" text-anchor="middle" >budgeted, read-only</text><line x1="1135" y1="390" x2="1135" y2="312" stroke="#56616E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-slate)"/><path d="M1135 462 V515 H18 V268 H38" fill="none" stroke="#56616E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-slate)"/><text x="620" y="540" font-size="14" fill="#56616E" font-weight="400" text-anchor="middle" >The only read on the main database: a budgeted check, compared at the same WAL position</text></svg>