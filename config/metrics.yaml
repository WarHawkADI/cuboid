# Cuboid metrics configuration: what is aggregated, and how.
# Edit this file while Cuboid runs: new rollups are built from the mirror
# and become queryable without a restart (bonus B-4).

timezone: from_main_db            # read SHOW TimeZone on the main database at startup

tenancy:
  tenant_column: tenant_id         # every published table carries the store id
  company: {table: tenants, key: tenant_id, column: company_id, name_column: name}

sources:
  orders:
    key: [tenant_id, order_id]
    time: created_at
    count_measure: orders
    measures:                      # exact and retractable
      orders: {type: count}
      sales:  {type: sum, column: amount_paise, scale: 2, minor_units: true, unit: INR, nonnegative: true}
      units:  {type: sum, column: quantity, nonnegative: true}   # nonnegative: checked against the main DB's CHECKs
    derived:
      average_order_value: {expr: "sales / orders", round: half_up}
    dimensions:
      status:         {column: status}
      payment_method: {column: payment_method}
      channel:        {column: channel}
      product_id:     {column: product_id, type: key, label: {table: products, column: name}}
      customer_id:    {column: customer_id, type: key}
      category:       {join: {table: products, on: product_id, column: category}}
      city:           {join: {table: customers, on: customer_id, column: city}}
    top:                           # GET /tenants/{id}/<entity>/top
      products:  {dim: product_id}
      customers: {dim: customer_id}
      cities:    {dim: city}
  products:
    key: [tenant_id, product_id]
  customers:
    key: [tenant_id, customer_id]
    pii_columns: [full_name, email, phone]   # never copied into the aggregate store
  tenants:
    key: [tenant_id]

  # Mitigata's own shape of data, on the same engine through config only (W9):
  # a tenant is a client organisation; the same four queries, isolation and checks.
  soc_alerts:
    key: [tenant_id, alert_id]
    time: created_at
    count_measure: alerts
    pii_columns: [analyst_note]
    measures:
      alerts:     {type: count}
      risk_total: {type: sum, column: risk_score}
    derived:
      average_risk: {expr: "risk_total / alerts", round: half_up}
    dimensions:
      severity:       {column: severity}
      status:         {column: status}
      source_product: {column: source_product}
      tactic:         {column: tactic}
      asset_id:       {column: asset_id, type: key}
    top:
      assets:  {dim: asset_id}
      tactics: {dim: tactic}

rollups:
  totals:          {source: orders, dims: [],                    grains: {hour: all,  day: all,  month: all}}
  by_status:       {source: orders, dims: [status],              grains: {hour: all,  day: all,  month: all}}
  status_category: {source: orders, dims: [status, category],    grains: {hour: 120d, day: all,  month: all}}
  status_channel:  {source: orders, dims: [status, channel],     grains: {hour: 120d, day: all,  month: all}}
  top_product:     {source: orders, dims: [status, product_id],  grains: {hour: 35d,  day: all,  month: all}, key_dim: product_id}
  top_customer:    {source: orders, dims: [status, customer_id], grains: {day: 100d,  month: all}, key_dim: customer_id}
  top_city:        {source: orders, dims: [status, city],        grains: {day: all,   month: all}}
  # Month totals per customer let the top-customers list read a few hundred
  # customers instead of every one in the range (ADR-011). Never answers a query.
  customer_month:  {source: orders, dims: [customer_id],         grains: {month: all}, rank: true}

  alert_totals:      {source: soc_alerts, dims: [],                    grains: {hour: all, day: all, month: all}}
  alert_severity:    {source: soc_alerts, dims: [severity, status],    grains: {hour: 120d, day: all, month: all}}
  alert_tactic:      {source: soc_alerts, dims: [tactic, severity],    grains: {hour: 35d, day: all, month: all}}
  alert_source:      {source: soc_alerts, dims: [source_product, severity], grains: {day: all, month: all}}
  alert_asset:       {source: soc_alerts, dims: [severity, asset_id],  grains: {day: all, month: all}, key_dim: asset_id}
